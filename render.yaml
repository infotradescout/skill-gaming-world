services:
  - type: web
    name: skill-gaming-world-web
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: COMPETITION_SEED_ENCRYPTION_KEY
        sync: false
      - key: FEATURE_MONETAIRE_PRIZE
        value: "false"
      - key: FEATURE_SOCIAL_CASINO
        value: "false"
      - key: FEATURE_REAL_MONEY_CASINO
        value: "false"
      - key: FEATURE_PRODUCTION_PAYMENTS
        value: "false"
