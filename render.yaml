services:
  - type: web
    name: skill-gaming-world-web
    runtime: node
    plan: starter
    region: ohio
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: COMPETITION_SEED_ENCRYPTION_KEY
        generateValue: true
      - key: PREVIEW_OWNER_EMAIL
        sync: false
      - key: FEATURE_MONETAIRE_PRIZE
        value: "false"
      - key: FEATURE_SOCIAL_CASINO
        value: "false"
      - key: FEATURE_REAL_MONEY_CASINO
        value: "false"
      - key: FEATURE_PRODUCTION_PAYMENTS
        value: "false"
      - key: MONETAIRE_PLAY_JURISDICTIONS
        value: US
      - key: MONETAIRE_PLAY_DEPLOYMENT_JURISDICTION
        value: US
